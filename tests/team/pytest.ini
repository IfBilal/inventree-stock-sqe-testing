[pytest]
DJANGO_SETTINGS_MODULE = InvenTree.settings
pythonpath = ../../upstream/src/backend/InvenTree
testpaths = unit generator api
addopts = -p no:cacheprovider --reuse-db --no-migrations -q
markers =
    req(ids): requirement IDs covered by the test (FR-xx / BR-x) for the traceability matrix
    risk(ids): risk IDs addressed
